name: Build and Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      サーバーを全削除して再デプロイ:
        description: "選択すると、サーバー上の全ファイルを削除してからアップロードします（通常は差分同期のため不要）"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. 品質ゲート (型検査 & 包括QAテスト) ───
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Type Check & Tests (Parallel)
        shell: bash
        run: |
          npm run type-check &
          PID_TYPE=$!
          npm test &
          PID_TEST=$!
          wait $PID_TYPE
          STATUS_TYPE=$?
          wait $PID_TEST
          STATUS_TEST=$?
          if [ $STATUS_TYPE -ne 0 ] || [ $STATUS_TEST -ne 0 ]; then
            echo "❌ Quality check failed (type-check: $STATUS_TYPE, tests: $STATUS_TEST)"
            exit 1
          fi

  # ─── 2. 本番ビルド (quality-gateと並行実行) ───
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build with GitHub Secrets
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_ADSENSE_CLIENT_ID: ${{ secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_DEFAULT_SLOT: ${{ secrets.VITE_ADSENSE_DEFAULT_SLOT }}
        run: |
          npm run build
          # SPA用 404フォールバック
          cp dist/index.html dist/404.html

      - name: Verify Post-Build Production Assets
        run: npm test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 1

  # ─── 3. FTP デプロイ (シークレット未設定時は安全にスキップ) ───
  deploy-ftp:
    needs: [quality-gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check if FTP Secrets are configured
        id: check-ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "ℹ️ FTP_SERVER is not configured yet. Skipping FTP deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Mask FTP Server IP Addresses
        if: steps.check-ftp.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          HOST="${FTP_SERVER#*://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          if [ -n "$HOST" ]; then
            for ADDR in $(getent ahosts "$HOST" 2>/dev/null | awk '{print $1}' | sort -u); do
              echo "::add-mask::$ADDR"
            done
            if echo "$HOST" | grep -Eq '^[0-9.]+$|^[0-9a-fA-F:]+$'; then
              echo "::add-mask::$HOST"
            fi
          fi

      - name: Download Build Artifacts
        if: steps.check-ftp.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Deploy via FTP
        if: steps.check-ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./dist/"
          server-dir: "${{ secrets.FTP_TARGET_DIR }}"
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs['サーバーを全削除して再デプロイ'] || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/*.log
            **/*.lock
            **/*.sql

  # ─── 4. Lighthouse 並列分散監査 (4シャード均等分散で高速並列実行) ───
  lighthouse-audit:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Setup Lighthouse CLI Cache
        uses: actions/cache@v4
        id: lh-cache
        with:
          path: /home/runner/.npm-global
          key: ${{ runner.os }}-lighthouse-cli-v13

      - name: Install Lighthouse CLI
        if: steps.lh-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/.npm-global
          npm config set prefix /home/runner/.npm-global
          npm install -g lighthouse

      - name: Run Sharded Lighthouse Audit
        run: |
          export PATH="/home/runner/.npm-global/bin:$PATH"
          npx tsx scripts/audit-lighthouse.ts --shard=${{ matrix.shard }}/4 --report-json=dist-reports/shard-${{ matrix.shard }}.json

      - name: Upload Shard Report
        uses: actions/upload-artifact@v4
        with:
          name: lh-shard-${{ matrix.shard }}
          path: dist-reports/shard-${{ matrix.shard }}.json
          retention-days: 1

  # ─── 5. Lighthouse 監査結果集約 & Issue 自動管理 (BlossomsArchive Tools 準拠) ───
  lighthouse-report:
    needs: [lighthouse-audit]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Download All Shard Reports
        uses: actions/download-artifact@v4
        with:
          pattern: lh-shard-*
          path: dist-shards/
          merge-multiple: true

      - name: Aggregate Reports
        id: aggregate
        run: |
          npx tsx scripts/audit-lighthouse.ts --aggregate=dist-shards

      - name: Create Issue on PageSpeed Regression
        if: steps.aggregate.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: 'Asia/Tokyo'
        run: |
          OLD_ISSUES=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title | startswith("[PageSpeed Alert]")) | .number')
          NEW_URL=$(gh issue create \
            --title "[PageSpeed Alert] Lighthouse スコア退行を検出しました ($(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M'))" \
            --body-file dist/lighthouse-issue.md)
          for NUM in $OLD_ISSUES; do
            gh issue close "$NUM" --comment "🔄 新しい監査結果 ($NEW_URL) に更新されたため、古いレポートを自動クローズしました。"
          done

      - name: Close Resolved PageSpeed Issues
        if: steps.aggregate.outputs.has_issues == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for NUM in $(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title | startswith("[PageSpeed Alert]")) | .number'); do
            gh issue close "$NUM" --comment "✅ 最新のCI監査にて全40ゲーム（ライト/ダーク×モバイル/デスクトップ）で Lighthouse 監査基準クリアを確認したため、古いIssueを自動クローズしました。"
          done
