<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlossomsArchive Games - ミニゲームコレクション</title>
    <meta name="description" content="ブラウザですぐ遊べる、軽量で美しいミニゲームポータル。登録不要・完全無料。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function() {
        var p = window.location.pathname;
        if (p && p.indexOf('/game/') !== -1) {
          var match = p.match(/\/game\/[^/]+/);
          if (match) {
            var base = p.slice(0, p.indexOf('/game/'));
            var target = window.location.origin + base + '/#' + match[0] + window.location.search;
            window.location.replace(target);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen selection:bg-slate-700 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
